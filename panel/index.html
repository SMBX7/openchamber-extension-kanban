<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban</title>
    <style>
      :root {
        --kanban-gap: 18px;
        --kanban-radius: 16px;
        --card-radius: 10px;
        --mint: var(--oc-success);
        --mint-text: var(--oc-success-text, var(--oc-success));
        --relief-card: 4px 4px 10px rgba(0, 0, 0, .22), -3px -3px 8px rgba(255, 255, 255, .035);
        --relief-btn: 3px 3px 7px rgba(0, 0, 0, .20), -2px -2px 6px rgba(255, 255, 255, .03);
        --relief-inset: inset 2px 2px 5px rgba(0, 0, 0, .22), inset -2px -2px 5px rgba(255, 255, 255, .03);
        color-scheme: inherit;
      }
      html[data-oc-theme="light"] {
        --relief-card: 4px 4px 10px rgba(54, 70, 94, .14), -4px -4px 10px rgba(255, 255, 255, .90);
        --relief-btn: 3px 3px 7px rgba(54, 70, 94, .13), -3px -3px 7px rgba(255, 255, 255, .90);
        --relief-inset: inset 2px 2px 5px rgba(54, 70, 94, .14), inset -2px -2px 5px rgba(255, 255, 255, .90);
      }
      /* Neumorfismo: relieve más profundo */
      html[data-style="neumorphism"] {
        --kanban-radius: 20px;
        --card-radius: 14px;
      }
      html[data-style="neumorphism"] .project-chip,
      html[data-style="neumorphism"] .quick-filter {
        border-radius: 10px;
      }
      html[data-style="neumorphism"] .column {
        background:
          radial-gradient(140% 90% at 16% 0%, rgba(255, 255, 255, .05), transparent 58%),
          radial-gradient(140% 100% at 84% 100%, rgba(0, 0, 0, .15), transparent 62%),
          linear-gradient(145deg,
            color-mix(in srgb, var(--oc-elevated) 97%, var(--column-tone, var(--oc-border)) 3%),
            color-mix(in srgb, var(--oc-elevated) 94%, var(--column-tone, var(--oc-border)) 6%));
        box-shadow:
          3px 3px 6px rgba(0, 0, 0, .45),
          inset 0 2px 5px rgba(255, 255, 255, .02),
          inset 0 -3px 10px rgba(0, 0, 0, .10);
      }
      html[data-style="neumorphism"] .card {
        background:
          radial-gradient(150% 100% at 18% 0%, rgba(255, 255, 255, .04), transparent 58%),
          radial-gradient(150% 100% at 82% 100%, rgba(0, 0, 0, .12), transparent 62%),
          linear-gradient(145deg, rgba(255, 255, 255, .05), rgba(0, 0, 0, .06)),
          var(--kanban-card-bg, color-mix(in srgb, var(--oc-elevated) 88%, var(--oc-fg) 12%));
        box-shadow:
          1px 1px 4px rgba(0, 0, 0, .30),
          inset 0 2px 5px rgba(255, 255, 255, .02),
          inset 0 -3px 8px rgba(0, 0, 0, .09);
      }


      html[data-style="neumorphism"] .field input,
      html[data-style="neumorphism"] .field select,
      html[data-style="neumorphism"] .search-input,
      html[data-style="neumorphism"] .mini-select,
      html[data-style="neumorphism"] .settings-textarea,
      html[data-style="neumorphism"] .description,
      html[data-style="neumorphism"] .session-select,
      html[data-style="neumorphism"] .task-add input {
        background-color: color-mix(in srgb, var(--oc-elevated) 88%, var(--oc-fg) 12%);
        box-shadow: var(--relief-inset);
      }
      html[data-style="neumorphism"] .settings-box,
      html[data-style="neumorphism"] .login-card {
        border-color: transparent;
        background-color: color-mix(in srgb, var(--oc-elevated) 92%, var(--oc-fg) 8%);
        box-shadow: var(--relief-btn);
      }
      html[data-style="neumorphism"] .mode-card,
      html[data-style="neumorphism"] .style-card {
        box-shadow: var(--relief-btn);
      }
      html[data-style="neumorphism"] .mode-card[aria-pressed="true"],
      html[data-style="neumorphism"] .style-card[aria-pressed="true"] {
        box-shadow: var(--relief-inset);
      }
      html[data-style="neumorphism"] .sheet {
        box-shadow: -14px 0 34px rgba(0, 0, 0, .32);
      }
      html[data-style="neumorphism"] .menu-select-menu {
        box-shadow: 8px 8px 22px rgba(0, 0, 0, .38), -4px -4px 14px rgba(255, 255, 255, .035);
      }
      html[data-style="neumorphism"] .sort-pop {
        box-shadow: 8px 8px 22px rgba(0, 0, 0, .38), -4px -4px 14px rgba(255, 255, 255, .035);
      }
      html[data-style="neumorphism"] .sort-step { box-shadow: var(--relief-inset); }

      /* Brutalismo: gris claro, esquinas rectas, sombras sólidas */
      html[data-style="brutalism"] {
        --kanban-radius: 0px;
        --card-radius: 0px;
        --brutal-line: color-mix(in srgb, var(--oc-fg) 55%, transparent);
        --relief-btn: 2px 2px 0 var(--brutal-line);
        --relief-inset: none;
      }
      html[data-style="brutalism"] *:not(.col-dot):not(.board-dot):not(.brand-dot):not(.dot):not(.label-dot):not(.session-dot) {
        border-radius: 0;
      }
      html[data-style="brutalism"] .column {
        border: 2px solid var(--brutal-line);
        background: var(--oc-elevated);
        box-shadow: 6px 6px 0 rgba(0, 0, 0, .40);
        padding-bottom: 10px;
      }
      html[data-style="brutalism"] .card {
        border: 2px solid var(--brutal-line);
        box-shadow: 3px 3px 0 var(--brutal-line);
      }
      html[data-style="brutalism"] .card-title { font-weight: 700; }
      html[data-style="brutalism"] .card-actions { opacity: 1; }
      html[data-style="brutalism"] .card-edit,
      html[data-style="brutalism"] .card-delete {
        border: 2px solid var(--brutal-line); background: var(--oc-elevated); color: var(--oc-fg);
        box-shadow: 2px 2px 0 var(--brutal-line);
      }
      html[data-style="brutalism"] .add-card,
      html[data-style="brutalism"] .col-add {
        width: 26px; height: 26px; opacity: 1;
        border: 2px solid var(--brutal-line); background: var(--oc-elevated); color: var(--oc-fg);
        box-shadow: 2px 2px 0 var(--brutal-line);
      }
      html[data-style="brutalism"] .sheet { border-left: 3px solid var(--brutal-line); }


      html[data-style="brutalism"] .field input,
      html[data-style="brutalism"] .field select,
      html[data-style="brutalism"] .search-input,
      html[data-style="brutalism"] .mini-select,
      html[data-style="brutalism"] .settings-textarea,
      html[data-style="brutalism"] .description,
      html[data-style="brutalism"] .session-select,
      html[data-style="brutalism"] .task-add input,
      html[data-style="brutalism"] .composer input {
        background-color: var(--oc-elevated);
        border: 2px solid var(--brutal-line);
        box-shadow: 2px 2px 0 var(--brutal-line);
      }
      html[data-style="brutalism"] .settings-box,
      html[data-style="brutalism"] .login-card {
        background: var(--oc-elevated);
        border: 2px solid var(--brutal-line);
        box-shadow: 4px 4px 0 var(--brutal-line);
      }
      html[data-style="brutalism"] .mode-card,
      html[data-style="brutalism"] .style-card,
      html[data-style="brutalism"] .source-btn {
        border-width: 2px;
        box-shadow: 2px 2px 0 var(--brutal-line);
      }
      html[data-style="brutalism"] .mode-card:not([aria-pressed="true"]),
      html[data-style="brutalism"] .style-card:not([aria-pressed="true"]),
      html[data-style="brutalism"] .source-btn:not([aria-pressed="true"]) {
        border-color: var(--brutal-line);
      }
      html[data-style="brutalism"] .mode-card::before { border-radius: 0; }
      html[data-style="brutalism"] .menu-select-menu,
      html[data-style="brutalism"] .undo-bar,
      html[data-style="brutalism"] .sort-pop {
        border: 2px solid var(--brutal-line);
        box-shadow: 4px 4px 0 var(--brutal-line);
      }
      html[data-style="brutalism"] .col-sort {
        border: 2px solid var(--brutal-line);
        background: var(--oc-elevated);
        color: var(--oc-fg);
        opacity: 1;
      }


      html[data-style="brutalism"] .settings-section:not(:first-child),
      html[data-style="brutalism"] .sheet-foot {
        border-top: 2px solid var(--brutal-line);
      }
      html[data-style="brutalism"] .settings-heading::before { border-radius: 0; }

      /* Cristal */
      html[data-style="glass"] {
        --kanban-radius: 20px;
        --card-radius: 14px;
        --relief-btn: 0 4px 12px rgba(0, 0, 0, .22), inset 0 1px 0 rgba(255, 255, 255, .18);
        --relief-inset: inset 0 1px 0 rgba(255, 255, 255, .10);
      }
      html[data-style="glass"] .column {
        -webkit-backdrop-filter: blur(26px) saturate(180%);
        backdrop-filter: blur(26px) saturate(180%);
        background:
          linear-gradient(160deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .025) 42%, rgba(255, 255, 255, .008) 68%),
          color-mix(in srgb, var(--oc-elevated) 48%, transparent);
        border: 1px solid rgba(255, 255, 255, .18);
        box-shadow:
          0 3px 8px rgba(0, 0, 0, .30),
          inset 0 0 22px color-mix(in srgb, var(--column-tone, var(--oc-info)) 20%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, .22);
      }
      html[data-style="glass"] .card {
        background:
          linear-gradient(112deg, rgba(255, 255, 255, .09) 0%, rgba(255, 255, 255, .025) 16%, transparent 30%),
          linear-gradient(150deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .01) 55%, transparent),
          color-mix(in srgb, var(--oc-elevated) 86%, var(--oc-fg) 14%);
        -webkit-backdrop-filter: blur(16px) saturate(170%);
        backdrop-filter: blur(16px) saturate(170%);
        border: 1px solid rgba(255, 255, 255, .20);
        box-shadow:
          0 2px 8px rgba(0, 0, 0, .26),
          inset 0 1px 0 rgba(255, 255, 255, .14);
      }
      html[data-style="glass"] .sheet {
        backdrop-filter: blur(26px) saturate(160%);
        background: color-mix(in srgb, var(--oc-elevated) 74%, transparent);
      }
      html[data-style="glass"] .project-chip,
      html[data-style="glass"] .mini-select,
      html[data-style="glass"] .settings-select,
      html[data-style="glass"] .ghost-btn,
      html[data-style="glass"] .btn-mint,
      html[data-style="glass"] .icon-btn,
      html[data-style="glass"] .quick-filter,
      html[data-style="glass"] .source-btn,
      html[data-style="glass"] .style-card,
      html[data-style="glass"] .sheet-title,
      html[data-style="glass"] .field input,
      html[data-style="glass"] .field select { border-radius: 14px; }
      /* The card action is a 20px square; in glass the rest of the buttons are
         pills, so it becomes a circle instead of staying square. */
      html[data-style="glass"] .card-edit { border-radius: 999px; }


      html[data-style="glass"] .field input,
      html[data-style="glass"] .field select,
      html[data-style="glass"] .search-input,
      html[data-style="glass"] .mini-select,
      html[data-style="glass"] .settings-textarea,
      html[data-style="glass"] .description,
      html[data-style="glass"] .session-select,
      html[data-style="glass"] .task-add input,
      html[data-style="glass"] .composer input,
      html[data-style="glass"] .menu-select-button,
      html[data-style="glass"] .tool-chip {
        background-color: color-mix(in srgb, var(--oc-elevated) 55%, transparent);
        border-color: rgba(255, 255, 255, .18);
        -webkit-backdrop-filter: blur(12px) saturate(150%);
        backdrop-filter: blur(12px) saturate(150%);
      }
      html[data-style="glass"] .settings-box,
      html[data-style="glass"] .login-card {
        background:
          linear-gradient(150deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02)),
          color-mix(in srgb, var(--oc-elevated) 48%, transparent);
        border-color: rgba(255, 255, 255, .16);
        -webkit-backdrop-filter: blur(14px) saturate(150%);
        backdrop-filter: blur(14px) saturate(150%);
      }
      html[data-style="glass"] .mode-card:not([aria-pressed="true"]),
      html[data-style="glass"] .style-card:not([aria-pressed="true"]),
      html[data-style="glass"] .source-btn:not([aria-pressed="true"]),
      html[data-style="glass"] .label-chip:not([aria-pressed="true"]) {
        background:
          linear-gradient(150deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02)),
          color-mix(in srgb, var(--oc-elevated) 46%, transparent);
        border-color: rgba(255, 255, 255, .16);
      }
      html[data-style="glass"] .mode-card,
      html[data-style="glass"] .style-card,
      html[data-style="glass"] .source-btn,
      html[data-style="glass"] .label-chip {
        -webkit-backdrop-filter: blur(12px) saturate(150%);
        backdrop-filter: blur(12px) saturate(150%);
      }
      html[data-style="glass"] .menu-select-menu {
        background:
          linear-gradient(150deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02)),
          color-mix(in srgb, var(--oc-elevated) 78%, transparent);
        border-color: rgba(255, 255, 255, .18);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
        backdrop-filter: blur(18px) saturate(150%);
      }
      html[data-style="glass"] .sort-pop {
        background:
          linear-gradient(150deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02)),
          color-mix(in srgb, var(--oc-elevated) 78%, transparent);
        border-color: rgba(255, 255, 255, .18);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
        backdrop-filter: blur(18px) saturate(150%);
      }
      html[data-style="glass"] .col-sort { border-radius: 10px; }


      html[data-style="glass"] .add-card,
      html[data-style="glass"] .col-add,
      html[data-style="glass"] .card-edit,
      html[data-style="glass"] .card-delete,
      html[data-style="glass"] .card-done {
        border-radius: 10px;
      }
      html[data-style="glass"] .undo-bar {
        background: color-mix(in srgb, var(--oc-elevated) 82%, transparent);
        border-color: rgba(255, 255, 255, .18);
        -webkit-backdrop-filter: blur(16px) saturate(150%);
        backdrop-filter: blur(16px) saturate(150%);
      }

      html[data-style="neumorphism"] .column.drop-target,
      html[data-style="brutalism"] .column.drop-target,
      html[data-style="glass"] .column.drop-target {
        background: color-mix(in srgb, var(--oc-elevated) 82%, var(--column-tone, var(--mint)) 18%);
        border-color: var(--column-tone, var(--mint));
      }


      html[data-style="glass"] .icon-btn:hover,
      html[data-style="glass"] .ghost-btn:hover,
      html[data-style="glass"] .menu-select-button:hover,
      html[data-style="glass"] .source-btn:not([aria-pressed="true"]):hover,
      html[data-style="glass"] .card-edit:hover,
      html[data-style="glass"] .card-done:hover,
      html[data-style="glass"] .add-card:hover,
      html[data-style="glass"] .col-add:hover,
      html[data-style="glass"] .project-chip:not(.auto):hover,
      html[data-style="glass"] .quick-filter:not([aria-pressed="true"]):hover,
      html[data-style="glass"] .mode-card:hover:not(:disabled):not([aria-pressed="true"]),
      html[data-style="glass"] .style-card:hover:not([aria-pressed="true"]) {
        background: rgba(255, 255, 255, .07);
      }

      .style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .style-card {
        display: flex; flex-direction: column; gap: 5px; padding: 8px; text-align: left;
        border: 1px solid var(--oc-border); border-radius: 10px; background: var(--oc-elevated);
        color: var(--oc-fg); box-shadow: var(--relief-btn);
      }
      .style-card:hover { background: var(--oc-hover); }
      .style-card[aria-pressed="true"] {
        border-color: color-mix(in srgb, var(--mint) 60%, var(--oc-border));
        background: color-mix(in srgb, var(--mint) 10%, transparent);
      }
      .style-preview {
        height: 26px; border-radius: 7px; border: 1px solid var(--oc-border);
        background: color-mix(in srgb, var(--oc-fg) 6%, transparent);
        box-shadow: inset 1px 1px 3px rgba(0, 0, 0, .2), inset -1px -1px 2px rgba(255, 255, 255, .05);
      }
      .style-preview[data-preview="brutalism"] {
        border: 2px solid var(--oc-muted); border-radius: 0; box-shadow: 3px 3px 0 var(--oc-muted);
      }
      .style-preview[data-preview="glass"] {
        border-radius: 11px; border-color: color-mix(in srgb, #fff 30%, transparent);
        background: linear-gradient(135deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .03));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 4px 10px rgba(0, 0, 0, .22);
      }
      .style-name { font-size: 11.5px; font-weight: 600; }
      .style-text { font-size: 11px; line-height: 1.4; color: color-mix(in srgb, var(--oc-muted) 82%, var(--oc-fg)); }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: var(--oc-bg);
        color: var(--oc-fg);
        font-family: var(--oc-font);
        font-size: 13px;
        line-height: 1.4;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: default; opacity: .55; }
      :focus-visible { outline: 2px solid var(--oc-focus, var(--oc-primary)); outline-offset: 1px; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }
      .icon {
        width: 16px; height: 16px; display: inline-block; flex: none;
        color: currentColor;
      }
      .icon > svg {
        width: 100%; height: 100%; display: block;
        fill: none; stroke: currentColor; stroke-width: 1.7;
        stroke-linecap: round; stroke-linejoin: round;
      }

      /* ---------- full page ---------- */
      .app {
        height: 100%; display: flex; flex-direction: column; gap: 14px;
        padding: 16px 18px 14px; background: var(--oc-bg);
      }
      .topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 32px; }
      .brand { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .01em; }
      .brand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); }
      .brand-sub { color: var(--oc-muted); font-weight: 400; font-size: 11px; }

      .field-wrap { position: relative; display: flex; align-items: center; }
      .field-wrap .icon { position: absolute; left: 9px; color: var(--oc-muted); pointer-events: none; }
      .search-input {
        width: 210px; max-width: 44vw; background: var(--oc-elevated); color: var(--oc-fg);
        border: 1px solid transparent; border-radius: 10px; padding: 7px 10px 7px 30px;
        font-size: 12px; outline: none;
      }
      .search-input::placeholder { color: var(--oc-muted); }
      .search-input:focus { border-color: var(--oc-focus, var(--oc-primary)); }

      .board-select, .mini-select {
        appearance: none; -webkit-appearance: none;
        background: var(--oc-elevated); color: var(--oc-fg); border: 1px solid transparent;
        border-radius: 10px; padding: 7px 26px 7px 10px; font-size: 12px; cursor: pointer;
        background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
        background-position: calc(100% - 14px) 52%, calc(100% - 10px) 52%;
        background-size: 4px 4px, 4px 4px; background-repeat: no-repeat;
      }
      .board-select:hover, .mini-select:hover { background-color: var(--oc-hover); }
      .project-chip {
        border: 1px solid var(--oc-border); background: transparent; color: var(--oc-muted);
        border-radius: 999px; padding: 6px 12px; font-size: 11px; line-height: 1.3;
        max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        transition: color .14s ease, background .14s ease, border-color .14s ease, box-shadow .14s ease;
      }
      .project-chip:hover { color: var(--oc-fg); background: var(--oc-hover); }
      .project-chip.missing { color: var(--oc-warning-text, var(--oc-warning)); border-color: color-mix(in srgb, var(--oc-warning) 45%, var(--oc-border)); }
      .quick-filter {
        display: inline-flex; align-items: center; gap: 5px; flex: none;
        border: 1px solid var(--oc-border); background: transparent; color: var(--oc-muted);
        border-radius: 999px; padding: 6px 10px; font-size: 10.5px; line-height: 1.2;
        white-space: nowrap;
      }
      .quick-filter:hover { color: var(--oc-fg); background: var(--oc-hover); }
      .quick-filter[aria-pressed="true"] {
        color: var(--oc-warning-text, var(--oc-warning));
        border-color: color-mix(in srgb, var(--oc-warning) 55%, var(--oc-border));
        background: color-mix(in srgb, var(--oc-warning) 14%, transparent);
      }
      .quick-filter-count { font-variant-numeric: tabular-nums; opacity: .8; }

      .project-chip.auto {
        color: var(--mint-text, var(--oc-success)); border-color: var(--mint);
        background: color-mix(in srgb, var(--mint) 30%, transparent);
        box-shadow: 0 0 0 1px var(--mint), 0 0 12px color-mix(in srgb, var(--mint) 32%, transparent), 2px 2px 6px rgba(0, 0, 0, .22);
      }
      .labeled-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .labeled-field-label {
        font-size: 9.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
        color: var(--oc-muted);
      }
      .topbar > .labeled-field { flex-direction: row; align-items: center; gap: 6px; }
      .topbar > .labeled-field .labeled-field-label { font-size: 10px; }
      .selector-row { display: flex; gap: 8px; }
      .selector-row .labeled-field { flex: 1 1 0; }
      .menu-select { position: relative; display: flex; min-width: 0; }
      .menu-select-button {
        display: flex; align-items: center; justify-content: space-between; gap: 6px;
        width: 100%; text-align: left; background: var(--oc-elevated); color: var(--oc-fg);
        border: 1px solid transparent; border-radius: 10px; padding: 7px 10px; font-size: 12px;
      }
      .menu-select-button:hover { background: var(--oc-hover); }
      .menu-select-button:disabled { opacity: .55; cursor: default; }
      .menu-select-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .card:hover .card-delete { opacity: .9; }
      .card-edit {
        width: 20px; height: 20px; padding: 0; line-height: 0;
        border: 0; border-radius: 6px; background: transparent; color: var(--oc-muted);
        display: grid; place-items: center; opacity: .45; transition: opacity .12s, color .12s, background .12s;
      }
      .card-edit:hover, .card-edit:focus-visible { opacity: 1; color: var(--oc-fg); background: var(--oc-hover); }
      .card-edit .icon { width: 12px; height: 12px; }
      .card:hover .card-edit { opacity: .9; }
      .card-done {
        position: absolute; top: 6px; right: 5px; width: 20px; height: 20px; padding: 0; line-height: 0;
        border: 0; border-radius: 6px; background: var(--oc-elevated); color: var(--oc-muted);
        display: grid; place-items: center; opacity: 0; transition: opacity .12s, color .12s;
      }
      .card:hover .card-done, .card-done:focus-visible { opacity: 1; }
      .card-done:hover { color: var(--mint-text); background: var(--oc-hover); }
      .card-done .icon { width: 13px; height: 13px; }

      .drop-line { height: 2px; border-radius: 2px; background: var(--mint); margin: -1px 2px; flex: none; }

      .add-card {
        align-self: center; width: 24px; height: 24px; padding: 0; line-height: 0; margin: 2px 0 4px;
        border: 0; border-radius: 7px; background: transparent; color: var(--oc-muted);
        display: grid; place-items: center; opacity: .55; transition: opacity .12s, color .12s, background .12s;
      }
      .col-head .add-card {
        width: 21px; height: 21px; margin: 0; opacity: .6;
      }
      .col-head .add-card .icon { width: 12px; height: 12px; }
      .col-count { margin-left: auto; }
      .add-card:hover { opacity: 1; color: var(--oc-fg); background: var(--oc-hover); }
      .done-close {
        justify-content: center;
        width: 100%;
        margin: 0 0 7px;
        color: var(--oc-warning-text, var(--oc-warning));
        border-color: color-mix(in srgb, var(--oc-warning) 45%, var(--oc-border));
        background: color-mix(in srgb, var(--oc-warning) 10%, transparent);
        font-size: 10.5px;
      }
      .done-close:hover {
        color: var(--oc-warning-text, var(--oc-warning));
        background: color-mix(in srgb, var(--oc-warning) 18%, transparent);
      }
      .done-close .icon { width: 11px; height: 11px; }

      /* ---------- ordenar IDEAS ---------- */
      .sort-pop {
        position: fixed; z-index: 85; display: flex; flex-direction: column; gap: 8px;
        padding: 10px 11px 11px; border-radius: 12px;
        background: var(--oc-elevated); border: 1px solid var(--oc-border);
        box-shadow: 0 12px 32px rgba(0, 0, 0, .34);
        color: var(--oc-fg); font-size: 11.5px; line-height: 1.45;
        animation: sort-pop-in .14s ease-out;
      }
      @keyframes sort-pop-in {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: none; }
      }
      .sort-pop-head { display: flex; align-items: center; gap: 6px; }
      .sort-pop-title { flex: 1 1 auto; font-size: 11.5px; font-weight: 600; }
      .sort-pop-close {
        flex: none; width: 20px; height: 20px; padding: 0; line-height: 0;
        border: 0; border-radius: 6px; background: transparent; color: var(--oc-muted);
        display: grid; place-items: center;
      }
      .sort-pop-close:hover { background: var(--oc-hover); color: var(--oc-fg); }
      .sort-pop-close .icon { width: 11px; height: 11px; }
      .sort-pop-note { margin: 0; color: var(--oc-muted); font-size: 10.5px; }
      .sort-criteria {
        margin: 0; padding: 0; list-style: none;
        display: flex; flex-direction: column; gap: 5px;
      }
      .sort-criterion { display: flex; align-items: flex-start; gap: 7px; }
      .sort-step {
        flex: none; width: 16px; height: 16px; border-radius: 5px;
        display: grid; place-items: center; font-size: 9.5px; font-weight: 700;
        color: var(--mint-text, var(--oc-success));
        background: color-mix(in srgb, var(--mint) 16%, transparent);
      }
      .sort-criterion-text { min-width: 0; display: flex; flex-direction: column; }
      .sort-criterion-label { font-size: 11px; color: var(--oc-fg); }
      .sort-criterion-hint { font-size: 9.5px; color: var(--oc-muted); }
      .sort-pop-foot { display: flex; flex-direction: column; gap: 5px; }
      .sort-run { width: 100%; padding: 6px 10px; }
      .sort-pop-status { font-size: 9.5px; color: var(--oc-muted); }

      .column.composing .add-card { display: none; }
      .composer { display: none; padding: 2px 2px 0; }
      .column.composing .composer { display: block; }
      .composer input {
        width: 100%; background: color-mix(in srgb, var(--oc-elevated) 82%, var(--oc-fg) 18%);
        border: 1px solid var(--mint); border-radius: 8px; padding: 7px 9px;
        color: var(--oc-fg); font-size: 12px; outline: none;
      }
      html[data-oc-theme="light"] .composer input,
      html[data-oc-theme="light"] .field input,
      html[data-oc-theme="light"] .field select,
      html[data-oc-theme="light"] .description {
        background: var(--oc-bg);
      }
      .composer-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .composer-hint { flex: 1 0 100%; text-align: center; font-size: 10px; color: var(--oc-muted); }
      .btn-mint {
        border: 0; border-radius: 7px; padding: 4px 10px; font-size: 11px; font-weight: 600;
        color: var(--mint-text); background: color-mix(in srgb, var(--mint) 18%, transparent);
      }
      .btn-mint:hover { background: color-mix(in srgb, var(--mint) 28%, transparent); }
      .composer .ghost-btn { padding: 4px 8px; font-size: 11px; border-color: transparent; }

      /* ---------- sheet ---------- */
      .sheet-backdrop {
        position: fixed; inset: 0; z-index: 40;
        background: color-mix(in srgb, var(--oc-bg) 58%, transparent);
        opacity: 0; transition: opacity .18s ease;
      }
      .sheet-backdrop.open { opacity: 1; }
      .sheet {
        position: fixed; top: 0; right: 0; bottom: 0; z-index: 41;
        width: min(430px, 100%); display: flex; flex-direction: column;
        background: var(--oc-elevated); border-left: 1px solid var(--oc-border);
        transform: translateX(102%); transition: transform .22s cubic-bezier(.2,.8,.2,1);
      }
      .sheet.open { transform: translateX(0); }
      .sheet.closing { transform: translateX(102%); }
      .sheet-head { display: flex; align-items: flex-start; gap: 8px; padding: 14px 14px 8px; }
      .sheet-title-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
      .sheet-title-wrap .section-label { margin-bottom: 0; }
      .sheet-title {
        width: 100%; box-sizing: border-box; display: block; min-width: 0; outline: none;
        background: color-mix(in srgb, var(--oc-elevated) 86%, var(--oc-fg) 14%);
        border: 1px solid transparent; border-radius: 8px;
        font-size: 17px; font-weight: 600; line-height: 1.25; color: var(--oc-fg);
        padding: 6px 8px; resize: none; overflow: hidden;
        white-space: pre-wrap; overflow-wrap: anywhere;
      }
      .sheet-title:focus { border-color: var(--oc-focus, var(--oc-primary)); }
      .sheet-scroll {
        flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 14px 18px;
        display: flex; flex-direction: column; gap: 16px;
        scrollbar-gutter: stable;
      }
      .section-label {
        display: block; font-size: 10px; font-weight: 600; letter-spacing: .09em;
        text-transform: uppercase; color: var(--oc-muted); margin-bottom: 7px;
      }
      .sheet-hint {
        margin: -3px 0 0; font-size: 10.5px; line-height: 1.45;
        color: var(--oc-muted);
      }

      .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
      .field > span { font-size: 11.5px; font-weight: 500; letter-spacing: 0; text-transform: none; color: color-mix(in srgb, var(--oc-muted) 75%, var(--oc-fg)); }
      .field input, .field select {
        width: 100%; background: color-mix(in srgb, var(--oc-elevated) 86%, var(--oc-fg) 14%);
        border: 1px solid transparent; border-radius: 8px; padding: 7px 8px; font-size: 12px; outline: none;
      }
      .field input:focus, .field select:focus { border-color: var(--oc-focus, var(--oc-primary)); }

      .sheet-session-section { display: flex; flex-direction: column; gap: 7px; }
      .sheet-session { display: flex; align-items: center; gap: 6px; }
      .session-select {
        flex: 1; min-width: 0;
        background: color-mix(in srgb, var(--oc-elevated) 86%, var(--oc-fg) 14%);
        border: 1px solid transparent; border-radius: 8px; padding: 7px 8px;
        font-size: 12px; color: var(--oc-fg); outline: none;
      }
      .session-select:focus { border-color: var(--oc-focus, var(--oc-primary)); }
      html[data-oc-theme="light"] .session-select { background: var(--oc-bg); }
      .session-note { font-size: 10.5px; line-height: 1.4; color: var(--oc-muted); }

      .checklist { display: flex; flex-direction: column; gap: 10px; }
      .checklist-head { display: flex; align-items: center; gap: 8px; }
      .checklist-head .progress { flex: 1; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--oc-fg) 12%, transparent); overflow: hidden; }
      .checklist-head .progress i { display: block; height: 100%; background: var(--mint); transition: width .18s ease; }
      .checklist-head .count { font-size: 10.5px; color: var(--oc-muted); font-variant-numeric: tabular-nums; }
      .task-list { display: flex; flex-direction: column; gap: 4px; }
      .task-list-name { font-size: 11px; color: var(--oc-muted); margin-bottom: 2px; }
      .task-row { display: flex; align-items: flex-start; gap: 8px; padding: 4px 2px; border-radius: 6px; }
      .task-check {
        width: 15px; height: 15px; margin-top: 1px; flex: none; border: 1.5px solid var(--oc-border);
        border-radius: 4px; background: transparent; display: grid; place-items: center; color: transparent;
      }
      .task-check .icon { width: 10px; height: 10px; stroke-width: 2.4; }
      .task-check[aria-checked="true"] { background: var(--mint); border-color: var(--mint); color: var(--oc-bg); }
      .task-row .task-name { font-size: 12px; line-height: 1.35; color: var(--oc-fg); overflow-wrap: anywhere; }
      .task-row.done .task-name { color: var(--oc-muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--oc-fg) 35%, transparent); }
      .task-add { display: flex; gap: 6px; margin-top: 3px; }
      .task-add input {
        flex: 1; min-width: 0; background: transparent; border: 1px solid var(--oc-border);
        border-radius: 7px; padding: 5px 8px; font-size: 11.5px; outline: none;
      }
      .task-add input:focus { border-color: var(--oc-focus, var(--oc-primary)); }
      .task-add button { border: 0; background: transparent; color: var(--mint-text); font-size: 11px; }

      .description {
        width: 100%; min-height: 110px; resize: vertical;
        background: color-mix(in srgb, var(--oc-elevated) 86%, var(--oc-fg) 14%);
        border: 1px solid transparent; border-radius: 10px; padding: 9px 10px;
        font-size: 12.5px; line-height: 1.5; outline: none;
      }
      .description:focus { border-color: var(--oc-focus, var(--oc-primary)); }

      .sheet-delete-section { margin-top: 4px; }
      .sheet-delete {
        color: var(--oc-error-text, var(--oc-error));
        border-color: color-mix(in srgb, var(--oc-error) 40%, var(--oc-border));
      }
      .sheet-delete:hover { background: color-mix(in srgb, var(--oc-error) 12%, transparent); }
      .sheet-delete.confirming { background: color-mix(in srgb, var(--oc-error) 18%, transparent); }

      .sheet-foot { display: flex; align-items: center; gap: 10px; padding: 10px 14px 14px; border-top: 1px solid var(--oc-border); }
      .save-state { font-size: 10.5px; color: var(--oc-muted); margin-right: auto; }
      .sheet-cancel { margin-left: 0; }
      .sheet-confirm { padding: 7px 13px; }
      .save-state.error { color: var(--oc-error-text, var(--oc-error)); }
      .btn-complete {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border: 1px solid color-mix(in srgb, var(--oc-border) 82%, var(--oc-fg) 18%);
        border-radius: 8px; padding: 6px 11px; font-size: 11.5px; font-weight: 500;
        color: var(--oc-muted); background: transparent;
      }
      .btn-complete:hover:not(:disabled) {
        color: var(--oc-fg);
        background: color-mix(in srgb, var(--oc-fg) 7%, transparent);
      }
      .btn-complete:disabled { opacity: .45; cursor: default; }
      .btn-complete .icon { width: 13px; height: 13px; }

      /* ---------- panel: the real board in the rail ---------- */
      .panel-app { padding: 10px; gap: 10px; }
      .panel-topbar { gap: 8px; min-height: 28px; flex-wrap: nowrap; }
      .panel-select { flex: 1 1 auto; min-width: 0; max-width: none; }
      .panel-board { gap: 10px; }
      .panel-board .column {
        min-width: 150px; border-radius: 14px; padding: 8px 6px 6px;
      }
      .panel-board .col-head { gap: 5px; padding: 0 3px 7px; }
      .panel-board .col-dot { width: 6px; height: 6px; }
      .panel-board .col-name { font-size: 10px; letter-spacing: .06em; }
      .panel-board .col-sort { width: 21px; padding: 0; }
      .panel-board .col-sort-label { display: none; }
      .panel-board .col-count { font-size: 9.5px; }
      .panel-board .cards { gap: 6px; padding: 3px 5px 8px; border-radius: 9px; }
      .panel-board .card { padding: 7px 8px; }
      .panel-board .card-title { font-size: 12px; }
      .panel-board .card-desc { font-size: 10.5px; }
      .panel-board .card-meta { gap: 5px; margin-top: 6px; font-size: 9.5px; }
      .panel-board .composer input { font-size: 11.5px; padding: 6px 7px; }
      .panel-board .composer-hint { display: none; }
      .panel-board .composer-row { gap: 4px; }
      .panel-board .btn-mint { padding: 3px 8px; font-size: 10.5px; }
      .panel-board .ghost-btn { padding: 3px 6px; font-size: 10.5px; }
      .panel-board .column-hint { font-size: 9.5px; }

      /* ---------- neumorphic buttons ---------- */
      .icon-btn, .ghost-btn, .btn-mint, .add-card, .col-add, .card-edit, .card-delete,
      .quick-filter, .project-chip, .menu-select-button, .btn-complete {
        box-shadow: var(--relief-btn);
        transition: box-shadow .12s ease, background .12s ease, color .12s ease, border-color .12s ease;
      }
      .icon-btn:active, .ghost-btn:active, .btn-mint:active, .add-card:active, .col-add:active,
      .card-edit:active, .card-delete:active, .quick-filter:active, .project-chip:active,
      .menu-select-button:active, .btn-complete:active {
        box-shadow: var(--relief-inset);
      }

      /* ---------- undo delete ---------- */
      .undo-bar {
        position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 90;
        display: flex; align-items: center; gap: 12px; max-width: calc(100% - 24px);
        padding: 10px 12px; border-radius: 12px; overflow: hidden;
        background: var(--oc-elevated); border: 1px solid var(--oc-border);
        box-shadow: 0 10px 30px rgba(0, 0, 0, .28); color: var(--oc-fg); font-size: 12px;
      }
      .undo-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
      .undo-action {
        border: 0; background: transparent; padding: 2px 4px; font-size: 12px; font-weight: 600;
        color: var(--mint-text, var(--oc-success));
      }
      .undo-progress {
        position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
        background: var(--mint); transform-origin: left;
        animation: undo-countdown 5s linear forwards;
      }
      @keyframes undo-countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }
      .undo-bar { animation: label-undo-in .18s ease-out; }
      @keyframes label-undo-in {
        from { opacity: 0; transform: translate(-50%, -10px); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }
      .auto-bar .undo-progress { animation-duration: 15s; background: var(--oc-info, var(--mint)); }
      .undo-cancel {
        border: 0; background: transparent; padding: 2px 4px; font-size: 12px;
        color: var(--oc-muted);
      }
      .undo-cancel:hover { color: var(--oc-fg); }

      /* ---------- compact rail ---------- */
      .compact { height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 12px; background: var(--oc-bg); }
      .compact-head { display: flex; align-items: center; gap: 7px; min-width: 0; }
      .compact-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .compact-head .brand-dot { flex: none; }
      .compact-head .mini-select { margin-left: auto; max-width: 130px; padding: 4px 22px 4px 8px; font-size: 10.5px; }
      .compact-section { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
      .compact-section-title {
        display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 600;
        letter-spacing: .1em; text-transform: uppercase; color: var(--oc-muted);
      }
      .compact-section-title .count { margin-left: auto; color: var(--oc-muted); }
      .today-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-height: 0; }
      .today-row {
        display: flex; align-items: flex-start; gap: 7px; width: 100%; text-align: left;
        border: 0; background: transparent; border-radius: 8px; padding: 6px 5px; color: inherit;
      }
      .today-row:hover { background: var(--oc-hover); }
      .today-row .col-dot { margin-top: 5px; }
      .today-body { min-width: 0; flex: 1; }
      .today-name {
        font-size: 12px; line-height: 1.3; color: var(--oc-fg);
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      .today-meta { font-size: 10px; color: var(--oc-muted); margin-top: 2px; }
      .today-row .card-done { position: static; opacity: 0; margin-left: auto; }
      .today-row:hover .card-done, .today-row .card-done:focus-visible { opacity: 1; }
      .compact-empty { font-size: 11px; color: var(--oc-muted); padding: 5px 4px 2px; }
      .compact-counts { margin-top: auto; display: flex; flex-direction: column; gap: 7px; padding-top: 10px; border-top: 1px solid var(--oc-border); }
      .count-row { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--oc-muted); min-width: 0; }
      .count-row span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .count-row b { margin-left: auto; color: var(--oc-fg); font-weight: 600; font-variant-numeric: tabular-nums; }
      .compact-foot { display: flex; gap: 6px; }
      .compact-foot .ghost-btn { flex: 1; justify-content: center; padding: 5px 6px; }

      /* ---------- login / empty ---------- */
      .center { height: 100%; display: grid; place-items: center; padding: 16px; background: var(--oc-bg); overflow-y: auto; }
      .login-card {
        width: min(350px, 100%); background: var(--oc-elevated); border-radius: var(--kanban-radius);
        padding: 20px; display: flex; flex-direction: column; gap: 12px;
      }
      .login-card h1 { margin: 0; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      .login-card p { margin: 0; font-size: 11.5px; line-height: 1.45; color: var(--oc-muted); }
      .login-card .field input { background: color-mix(in srgb, var(--oc-elevated) 86%, var(--oc-fg) 14%); }
      .login-actions { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
      .login-actions .btn-mint { margin-left: auto; padding: 7px 14px; font-size: 12px; }
      .login-error { font-size: 11.5px; color: var(--oc-error-text, var(--oc-error)); background: color-mix(in srgb, var(--oc-error) 12%, transparent); border-radius: 8px; padding: 8px 10px; }
      .login-note { font-size: 11px; color: var(--oc-warning-text, var(--oc-muted)); background: color-mix(in srgb, var(--oc-warning) 14%, transparent); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 7px; }
      .login-note button { align-self: flex-start; border: 0; background: transparent; color: inherit; text-decoration: underline; text-underline-offset: 2px; font-size: 11px; padding: 0; }
      .empty-state { text-align: center; max-width: 300px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
      .empty-state h2 { margin: 0; font-size: 14px; }
      .empty-state p { margin: 0; font-size: 11.5px; color: var(--oc-muted); }

      @media (prefers-reduced-motion: reduce) {
        .card, .sheet, .sheet-backdrop, .tasks, .progress i { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
